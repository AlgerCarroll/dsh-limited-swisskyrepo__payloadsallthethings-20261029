name: check-markdown
on: [push, pull_request]

jobs:
  lint:
    name: Lint changed Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Identify changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        with:
          files: '**/*.md'
          separator: ","

      - name: Run markdownlint on changed Markdown files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: ${{ steps.changed-files.outputs.all_changed_files }}
          separator: ","
          config: ./.github/.markdownlint.json
